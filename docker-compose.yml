services:
  postgres:
    image: postgres:17
    container_name: bi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_password
      POSTGRES_DB: bi_database

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Carpetas del proyecto visibles dentro del contenedor (solo lectura),
      # para ejecutar los scripts SQL y cargar el CSV limpio con psql.
      - ./sql:/sql:ro
      - ./data:/data:ro

volumes:
  postgres_data:
